name: Scrape Basketball Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run Fox Sports scraper
        run: python scrape_foxsports.py

      - name: Add PPG_L10 from Sports Reference game logs
        run: python add_l10.py

      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add march_madness_players.csv
          git diff --cached --quiet || git commit -m "Add scraped March Madness player stats with PPG_L10"
          git pull --rebase origin claude/scrape-basketball-stats-LRDNF
          git push
